# MILK10K dermoscopy-only concept discovery experiment.
# Keeps the repo's uv/timm/PyTorch conventions and avoids extra dependencies.

metadata_csv: data/MILK10K/MILK10k_Training_Metadata.csv
groundtruth_csv: data/MILK10K/MILK10k_Training_GroundTruth.csv
supplement_csv: data/MILK10K/MILK10k_Training_Supplement.csv
image_dir: data/MILK10K/MILK10k_Training_Input/MILK10k_Training_Input
output_dir: output/milk10k_concept_discovery

seed: 42
limit: 0
models: E1,E2,E3,E4,E5,E6,E7

dinov2_model: vit_small_patch14_dinov2
pretrained: true
image_size: 224
feature_batch_size: 64
feature_num_workers: 8
feature_dtype: float16
amp: true
force_features: false

k: 50
topk_pool: 5
max_patches_for_discovery: 200000
max_patches_per_image: 64
kmeans_iters: 25
kmeans_batch_size: 8192
activation_batch_size: 128
pca_dim: 64
pca_sample_size: 50000
gmm_iters: 12
artifact_corr_threshold: 0.2

epochs: 160
mlp_epochs: 120
train_batch_size: 256
lr: 0.001
weight_decay: 0.0001
l1: 0.0001
mlp_hidden: 256
mlp_dropout: 0.2
class_weight: true
class_weight_mode: inverse
effective_num_beta: 0.999
early_stop_patience: 30
refit_train_val: false
