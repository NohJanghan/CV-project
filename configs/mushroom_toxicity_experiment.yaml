# Mushroom toxicity experiment using two disconnected datasets:
# - Dataset1: image -> species
# - Dataset2: tabular morphology concepts -> edible/poisonous
#
# Species -> toxicity is generated by download_mushroom_data.py from
# GBIF taxonomy metadata and Wikipedia weak-label sources with provenance.

dataset1_zip: data/mushrooms/raw/combined-kaggle-mushrooms-dataset.zip
dataset2_csv: data/mushrooms/uci/mushrooms.csv
toxicity_csv: data/mushrooms/species_toxicity_labels.csv
output_dir: output/mushroom_toxicity

seed: 42
max_images_per_species: 60
min_images_per_species: 20
models: M1,M2,M3,M4,M5

dinov2_model: vit_small_patch14_dinov2
pretrained: true
image_size: 224
feature_batch_size: 64
feature_num_workers: 4
feature_dtype: float16
amp: true
force_features: false

k: 40
topk_pool: 5
max_patches_for_discovery: 120000
max_patches_per_image: 48
kmeans_iters: 20
kmeans_batch_size: 8192
activation_batch_size: 128
pca_dim: 64

epochs: 120
train_batch_size: 256
lr: 0.001
weight_decay: 0.0001
l1: 0.00001
early_stop_patience: 25
refit_train_val: true

# A typical top-view mushroom image may reveal cap/ecology but not gills,
# stalk base, ring details, or spore print. M4 marks non-visible groups unknown.
visible_concept_groups: cap,ecology
unknown_train_prob: 0.15
